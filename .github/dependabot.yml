version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Commit messages must pass scripts/commitlint: "chore(deps): bump ...".
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned on purpose: the tag is the Rust version installed, and
      # dtolnay/rust-toolchain has tags for releases that don't exist yet.
      - dependency-name: dtolnay/rust-toolchain
