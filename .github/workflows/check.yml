name: Check

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

# A newer push or PR update supersedes a running check. A release's call runs
# under the caller's event (workflow_dispatch), so it is never cancelled here.
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
# Jobs build with the latest stable Rust; the MSRV job uses Cargo.toml's
# rust-version.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  host:
    # Clippy and tests on the host for every supported feature combination.
    # `--all-features` is not meaningful: the chip variants are mutually
    # exclusive and `esp-idf` only builds for ESP-IDF targets.
    name: Host (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: log
            args: --features log
          - name: st25r3916
            args: --no-default-features --features st25r3916
          - name: embedded-hal
            args: --features embedded-hal
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: host-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings
      - name: Test
        run: cargo test --locked ${{ matrix.args }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/{s/^rust-version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)
          if [ -z "${version}" ]; then
            echo "::notice::Cargo.toml declares no rust-version; skipping the MSRV check."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: steps.msrv.outputs.version != ''
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install libclang for bindgen
        if: steps.msrv.outputs.version != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: Swatinem/rust-cache@v2
        if: steps.msrv.outputs.version != ''
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check with the MSRV toolchain
        if: steps.msrv.outputs.version != ''
        env:
          # Newer lints are not the MSRV's concern.
          RUSTFLAGS: ""
        run: cargo check --locked --features log,embedded-hal
      - name: Check with the MSRV toolchain and freshly resolved dependencies
        if: steps.msrv.outputs.version != ''
        env:
          RUSTFLAGS: ""
        # Users don't get our Cargo.lock: make sure the newest semver-compatible
        # dependencies still build with the declared rust-version.
        run: |
          rm Cargo.lock
          cargo check --features log,embedded-hal

  cross:
    # Bare-metal targets: bindgen against the target's libc headers and the
    # RFAL C sources with the GNU cross compiler `cc` picks by default.
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
            include_dir: /usr/lib/arm-none-eabi/include
          - target: riscv32imac-unknown-none-elf
            # cc finds riscv64-unknown-elf-gcc for riscv32 targets and passes
            # -march/-mabi; compiling (not linking) needs no rv32 multilib.
            packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
            include_dir: /usr/lib/picolibc/riscv64-unknown-elf/include
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the cross compiler, libc headers and libclang
        env:
          PACKAGES: ${{ matrix.packages }}
          INCLUDE_DIR: ${{ matrix.include_dir }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086 # a space-separated package list
          sudo apt-get install -y --no-install-recommends libclang-dev ${PACKAGES}
          test -f "${INCLUDE_DIR}/string.h" || { echo "::error::no libc headers in ${INCLUDE_DIR}"; exit 1; }
      - name: Point bindgen and cc at the libc headers
        env:
          TARGET: ${{ matrix.target }}
          INCLUDE_DIR: ${{ matrix.include_dir }}
        run: |
          set -euo pipefail
          triple=$(printf '%s' "${TARGET}" | tr '-' '_')
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS_${triple}=-I${INCLUDE_DIR}"
            echo "CFLAGS_${triple}=-I${INCLUDE_DIR}"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}
      - name: Build with log
        run: cargo build --locked --target ${{ matrix.target }} --features log
      - name: Build with embedded-hal
        run: cargo build --locked --target ${{ matrix.target }} --features log,embedded-hal

  esp-idf:
    # Builds and links the `esp-idf` platform into the firmware in ci/esp-idf
    # (ESP32-C3). That crate pins the nightly (rust-toolchain.toml) and the
    # ESP-IDF version (.cargo/config.toml); it has no Cargo.lock, so this job
    # also checks the newest semver-compatible ESP crates.
    name: ESP-IDF (riscv32imc-esp-espidf)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ci/esp-idf
    env:
      # RUSTFLAGS replaces the target rustflags of ci/esp-idf/.cargo/config.toml,
      # so repeat them here.
      RUSTFLAGS: --cfg espidf_time64 -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned nightly
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          [ -n "${channel}" ] || { echo "::error::no channel in ci/esp-idf/rust-toolchain.toml"; exit 1; }
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rust-src
      - name: Install libclang and Python's venv module
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev python3-venv
      # ESP-IDF, its Python env and tools (GCC, CMake, Ninja, esp-clang);
      # embuild installs them into the build workspace (ci/esp-idf/.embuild),
      # not ~/.espressif. Its download archives (dist/) are not needed again.
      - uses: actions/cache@v5
        with:
          path: |
            ci/esp-idf/.embuild
            !ci/esp-idf/.embuild/espressif/dist
          key: embuild-${{ runner.os }}-${{ hashFiles('ci/esp-idf/.cargo/config.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ci/esp-idf
          key: esp-idf
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ldproxy
        run: cargo install ldproxy --locked
      - name: Build and link the firmware
        run: cargo build
      - name: Reject `esp-idf` together with `embedded-hal`
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/esp-idf-embedded-hal.log"
          if cargo check --features st25r3916-rfal/embedded-hal 2> "${log}"; then
            echo "::error::esp-idf + embedded-hal built on an ESP-IDF target; expected the compile_error! in src/platform/mod.rs"
            exit 1
          fi
          if ! grep -q 'features both provide the RFAL platform hooks' "${log}"; then
            cat "${log}"
            echo "::error::esp-idf + embedded-hal failed for another reason than the intended compile_error!"
            exit 1
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Builds the way docs.rs does (build.rs may skip the C toolchain there).
      DOCS_RS: "1"
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The feature list of [package.metadata.docs.rs] in Cargo.toml.
      - run: cargo doc --locked --no-deps --features log,embedded-hal

  package:
    # What `cargo publish` would upload: packages, verifies the tarball builds
    # on its own, and keeps it under crates.io's 10 MB limit.
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo publish --locked --dry-run
      - name: Check the package size
        run: |
          set -euo pipefail
          # `publish --dry-run` writes the archive to target/package/tmp-crate/.
          crate=$(find target/package -name '*.crate' -print -quit)
          [ -n "${crate}" ] || { echo "::error::no .crate archive found under target/package"; exit 1; }
          size=$(stat -c %s "${crate}")
          echo "${crate}: ${size} bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${size}" -lt 10000000 ] || { echo "::error::the package exceeds crates.io's 10 MB limit"; exit 1; }

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck scripts/*
