name: Release

# Cuts a release from main: computes the version from Conventional Commits,
# runs the checks, commits the version bump, tags it, publishes the crate to
# crates.io and creates the GitHub release.
#
# Every publishing step skips what already exists (tag, crate version, GitHub
# release), so a failed run can be finished with "Re-run failed jobs".
#
# Needs the CARGO_REGISTRY_TOKEN secret, and main must accept pushes from
# github-actions[bot] (allow it to bypass branch protection, if any).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version and notes and verify the package, but push and publish nothing
        type: boolean
        default: true
      bump:
        description: Version bump (auto computes it from Conventional Commits; ignored for the first release, which uses Cargo.toml's version)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE: st25r3916-rfal

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not ${GITHUB_REF_NAME}."
          exit 1

      # git-cliff reads the full history and tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          version=$(scripts/release-version "${BUMP}")
          {
            echo "version=${version}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "### Releasing v${version} from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Check
    needs: plan
    uses: ./.github/workflows/check.yml

  release:
    name: Release v${{ needs.plan.outputs.version }}
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The checked revision, not whatever main is now: if main moved on, the
      # push below is rejected instead of releasing unchecked commits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.120.0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: Commit and tag the version
        id: tag
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            # A retry: the version was already committed and tagged.
            echo "${tag} already exists; continuing from it."
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            git checkout --detach "${tag}"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the [package] version line; dependency versions stay untouched.
          sed -i '/^\[package\]/,/^\[/{s/^version *= *"[^"]*"/version = "'"${VERSION}"'"/;}' Cargo.toml
          grep -q "^version = \"${VERSION}\"" Cargo.toml || { echo "::error::failed to set the version in Cargo.toml"; exit 1; }
          # Refresh the crate's own entry in Cargo.lock.
          cargo update --workspace
          if ! git diff --quiet; then
            git commit --all --message "chore(release): ${tag}"
          else
            # The first release ships the version Cargo.toml already has.
            echo "Cargo.toml is already at ${VERSION}; tagging without a commit."
          fi
          git tag --annotate "${tag}" --message "${tag}"
          echo "push=true" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: |
          set -euo pipefail
          # HEAD carries the tag now, so --current renders its section.
          git-cliff --config cliff.toml --current --strip all > "$RUNNER_TEMP/notes.md"
          { echo "## v${VERSION}"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the package
        run: cargo publish --locked --dry-run

      - name: Push the release commit and tag
        if: env.DRY_RUN != 'true' && steps.tag.outputs.push == 'true'
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${VERSION}"

      - name: Publish to crates.io
        if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "${GITHUB_REPOSITORY} release workflow" \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
          if [ "${status}" = 200 ]; then
            echo "${CRATE} ${VERSION} is already on crates.io; skipping."
            exit 0
          fi
          [ -n "${CARGO_REGISTRY_TOKEN}" ] || { echo "::error::the CARGO_REGISTRY_TOKEN secret is not set"; exit 1; }
          cargo publish --locked

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "The GitHub release v${VERSION} already exists; skipping."
            exit 0
          fi
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
