[package]
name = "st25r3916-rfal"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
# One RFAL per binary: RFAL keeps its state in C globals, so Cargo must refuse to
# link two copies into one program. (0.1.0 did not declare `links`, so this only
# guards against 0.2 together with later versions.)
links = "rfal"
description = "Safe Rust wrapper around ST's RFAL C library (v4.0.2) for the ST25R3916 / ST25R3916B NFC reader ICs"
# The Rust wrapper is MIT OR Apache-2.0; the vendored ST RFAL sources in
# rfal/ are under ST's SLA0051 (not open source), see rfal/LICENSE-ST.md.
license = "(MIT OR Apache-2.0) AND LicenseRef-ST-SLA0051"
repository = "https://github.com/BierDav/st25r3916-rfal"
readme = "README.md"
keywords = ["nfc", "rfid", "st25r3916", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
include = [
    "/Cargo.toml",
    "/build.rs",
    "/src/**/*.rs",
    "/src/c/**/*.h",
    "/rfal/inc/*.h",
    "/rfal/src/**/*.c",
    "/rfal/src/**/*.h",
    "/rfal/LICENSE-ST.md",
    "/rfal/MODIFICATIONS.md",
    "/README.md",
    "/MIGRATION.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
# DOCS_RS is set on docs.rs, so build.rs only generates bindings there.
features = ["log", "defmt"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["st25r3916b"]

# Chip variant (selected at C compile time, so not additive). Exactly one should
# be enabled; `st25r3916b` is the default. Use `default-features = false,
# features = ["st25r3916"]` for the original ST25R3916. If both end up enabled,
# ST25R3916B is used (with a build warning); `NfcReader::new` then reports
# `HwMismatch` on an ST25R3916 and names the feature to switch.
st25r3916b = []
st25r3916 = []

# Crate diagnostics through the `log` facade.
log = ["dep:log"]
# Crate diagnostics through defmt, and `defmt::Format` for the public types.
# Additive with `log`: if both are enabled, diagnostics go to defmt.
defmt = ["dep:defmt", "embedded-hal/defmt-03"]

# ESP-IDF platform (`platform::esp_idf::EspPlatform`). Only has an effect on
# ESP-IDF targets (`target_os = "espidf"`).
esp-idf = ["dep:esp-idf-svc", "dep:esp-idf-hal", "dep:esp-idf-sys"]

# --- Opt-in deviations from ST's upstream RFAL behaviour (see rfal/MODIFICATIONS.md) ---
# Send an Apple ECP v1 "VAS only" frame whenever NFC-A technology detection finds
# nothing, so nearby iPhones bring up Apple Wallet.
apple-ecp = []
# Always use WUPA instead of REQA for NFC-A technology detection (also wakes HALTed cards).
force-wupa = []
# In poll-only discovery (no listen technologies) keep the RF field on between rounds.
poll-keep-field-on = []

# No-op since 0.2: the embedded-hal adapter (`Hal`) is always available. Kept so
# 0.1 manifests that enable it keep building.
embedded-hal = []

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
# The reader singleton flag. `require-cas`: targets without compare-and-swap
# (thumbv6m) need portable-atomic's `critical-section` feature or
# `--cfg portable_atomic_unsafe_assume_single_core`, otherwise a clear build error.
portable-atomic = { version = "1.15.0", default-features = false, features = ["require-cas"] }
log = { version = "0.4.35", optional = true }
defmt = { version = "1.2.0", optional = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.53.0", features = ["critical-section", "embassy-sync"], optional = true }
esp-idf-sys = { version = "0.38.1", optional = true }
esp-idf-hal = { version = "0.47.0", optional = true }

[build-dependencies]
bindgen = { version = "0.73.2", features = ["prettyplease"] }
cc = "1.11"
glob = "0.3.4"
