[package]
name = "st25r3916-rfal"
version = "0.1.0"
edition = "2021"

[features]
# By default, compile for the ST25R3916B transceiver variant.
default = ["st25r3916b"]

# Enable C compilation of RFAL. Disabled by default for library usage.
# Enable this in your binary crate if you have the target C compiler installed.
compile-c = []

# Enable platform-agnostic logging support.
log = ["dep:log"]

# Enable standard library support.
std = []

# ESP-IDF SDK integration. Enables ESP-IDF-specific safe wrappers and platform drivers.
esp-idf = [
    "dep:esp-idf-svc",
    "dep:esp-idf-sys",
    "dep:esp-idf-hal",
    "log",
    "std",
    "dep:embedded-hal"
]

# Use the ST25R3916 transceiver chip variant (mutually exclusive with st25r3916b).
st25r3916 = []

# Use the ST25R3916B transceiver chip variant (mutually exclusive with st25r3916).
st25r3916b = []

[dependencies]
strum = { version = "0.26", default-features = false, features = ["derive"] }
bon = { version = "3", default-features = false }
log = { version = "0.4.29", optional = true }
embedded-hal = { version = "1.0.0", optional = true }

[target.'cfg(any(target_os = "espidf", target_arch = "xtensa"))'.dependencies]
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-sync"], optional = true }
esp-idf-sys = { version = "0.37.2", optional = true }
esp-idf-hal = { version = "0.46.2", optional = true }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.0"
glob = "0.3.3"