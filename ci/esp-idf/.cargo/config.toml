# Applies only to cargo invocations from ci/esp-idf/; the crate itself has no
# cargo config. Follows esp-idf-template's std setup.
[build]
target = "riscv32imc-esp-espidf"

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Overridable from the environment, e.g. `MCU=esp32 cargo +esp build --target xtensa-esp32-espidf`.
MCU = "esp32c3"
ESP_IDF_VERSION = "v5.5.5"
