# git-cliff configuration: computes the next release version and the release
# notes from Conventional Commits. Used by .github/workflows/release.yml through
# scripts/release-version.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=8, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Early history predates Conventional Commits; leave those commits out of notes.
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  # Release commits only bump the version; keep them out of the notes.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(test|style|chore)", group = "<!-- 7 -->Maintenance" },
]
# Only stable release tags count; anything else (e.g. experiment tags) is ignored.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[bump]
# Cargo's 0.x convention: a breaking change bumps the minor version, anything
# else (features included) bumps the patch version.
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.1.0"
